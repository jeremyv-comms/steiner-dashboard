<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steiner Ranch Command</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
    <style>
        :root {
            --burnt-orange: #bf5700;
            --hickory: #3d2b1f;
            --smoke: rgba(15, 15, 15, 0.9);
            --butcher-paper: #f4e4bc;
            --warning-red: #e63946;
        }

        body {
            font-family: 'Segoe UI', serif;
            background: linear-gradient(var(--smoke), var(--smoke)), 
                        url('https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=1600');
            background-size: cover; background-attachment: fixed;
            color: var(--butcher-paper); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* News Ticker */
        .ticker-container { width: 100%; background: var(--hickory); border-bottom: 3px solid var(--burnt-orange); }
        .ticker-wrap { width: 100%; overflow: hidden; height: 45px; display: flex; align-items: center; }
        .ticker-label { background: var(--burnt-orange); padding: 0 25px; height: 100%; display: flex; align-items: center; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.8rem; }
        .ticker { display: flex; white-space: nowrap; padding-left: 100%; animation: ticker 80s linear infinite; }
        .ticker-item { padding: 0 40px; color: var(--butcher-paper); text-decoration: none; font-size: 1rem; font-style: italic; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .content-wrap { width: 95%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; padding: 25px 0; }

        /* Header Info */
        .top-row { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .clock-card {
            background: rgba(61, 43, 31, 0.95); padding: 25px; border-radius: 8px; border: 2px solid var(--burnt-orange);
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #clock { font-size: 4rem; font-weight: bold; color: var(--burnt-orange); margin: 0; }
        #date { font-size: 1.1rem; opacity: 0.8; text-transform: uppercase; }

        .forecast-card { background: rgba(20, 20, 20, 0.9); padding: 20px; border-radius: 8px; border-left: 10px solid var(--warning-red); }
        .forecast-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .forecast-table td { padding: 8px; border-bottom: 1px solid #333; font-size: 0.9rem; }

        /* Large Grid Tiles */
        .link-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px; margin: 10px 0;
        }
        .card {
            position: relative; height: 120px; border-radius: 8px; border: 1px solid #444;
            display: flex; align-items: flex-end; padding: 15px;
            text-decoration: none; color: white; font-weight: bold;
            background-size: cover; background-position: center; transition: 0.3s;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--burnt-orange); }
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); z-index: 1; }
        .card span { z-index: 2; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); text-transform: uppercase; }

        .fb { background-image: url('https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=400'); }
        .az { background-image: url('https://images.unsplash.com/photo-1523474253046-8cd2748b5fd2?w=400'); }
        .dr { background-color: #f4e4bc; color: #3d2b1f !important; border: 1px solid var(--burnt-orange); }
